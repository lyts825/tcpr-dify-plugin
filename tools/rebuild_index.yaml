identity:
  name: rebuild_index
  author: lyts825
  label:
    en_US: Rebuild Index
    zh_Hans: 重建索引
description:
  human:
    en_US: Rebuild a staging generation from the current snapshot and activate it transactionally.
    zh_Hans: 从当前快照构建 staging generation，成功后事务式激活。
  llm: Rebuild only from an existing generation; failed rebuilds do not change tcpr current.
parameters:
- name: generation_id
  type: string
  required: false
  default: ''
  label:
    en_US: Generation ID
    zh_Hans: Generation ID
  human_description:
    en_US: Optional generation identifier to rebuild; leave empty to use the current generation.
    zh_Hans: 可选的待重建 generation 标识；留空时使用当前 generation。
  form: form
output_schema:
  type: object
  properties:
    message: {type: string}
    status: {type: string}
    generation_id: {type: string}
    record_count: {type: number}
    previous_generation_id: {type: string}
extra:
  python:
    source: tools/rebuild_index.py
