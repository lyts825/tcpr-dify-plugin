identity:
  name: remote_query
  author: lyts825
  label:
    en_US: Remote Read-only Query
    zh_Hans: 远程只读数据库查询
description:
  human:
    en_US: Query a user-configured PostgreSQL or MySQL database without storing connection credentials. TCPR mode compiles hard filters and weighted soft ranking in the database.
    zh_Hans: 查询用户配置的 PostgreSQL 或 MySQL 远程数据库；TCPR 模式在数据库端编译硬约束和软约束排序，连接凭据仅用于本次调用。
  llm: TCPR mode is the default. Provide only the JSON TCPR query in tcpr_query_json; connection, table, and schema fields are form inputs. raw_sql is available only when query_mode is explicitly selected in the form.
parameters:
- name: query_mode
  type: string
  required: false
  default: tcpr
  options:
  - value: tcpr
    label:
      en_US: TCPR constraints
      zh_Hans: TCPR 约束查询
  - value: raw_sql
    label:
      en_US: Explicit raw SQL
      zh_Hans: 显式原始 SQL
  label:
    en_US: Query mode
    zh_Hans: 查询模式
  human_description:
    en_US: TCPR constraint query (default) or explicitly enabled bounded raw SQL.
    zh_Hans: TCPR 约束查询（默认）或显式启用的有限原始 SQL。
  llm_description: Do not change this form field or silently fall back to raw SQL.
  form: form
- name: database_type
  type: string
  required: true
  label:
    en_US: Database type
    zh_Hans: 数据库类型
  human_description:
    en_US: PostgreSQL or MySQL.
    zh_Hans: PostgreSQL 或 MySQL。
  llm_description: Do not infer or request this value; use the configured form value.
  form: form
- name: host
  type: string
  required: true
  label:
    en_US: Host
    zh_Hans: 主机
  human_description:
    en_US: Remote database hostname or IP address.
    zh_Hans: 远程数据库主机名或 IP 地址。
  llm_description: Do not request or change this connection field.
  form: form
- name: table
  type: string
  required: false
  label:
    en_US: Table
    zh_Hans: 数据表
  human_description:
    en_US: Table used by TCPR mode; only a validated identifier or schema.table is accepted.
    zh_Hans: TCPR 模式使用的数据表；仅接受经过校验的标识符或 schema.table。
  llm_description: Do not request or change this form field.
  form: form
- name: tcpr_schema_json
  type: string
  required: false
  label:
    en_US: TCPR schema JSON
    zh_Hans: TCPR Schema JSON
  human_description:
    en_US: Form-provided allowlist mapping TCPR attributes to database columns, including one primary_key.
    zh_Hans: 表单提供的 TCPR 属性到数据库列的白名单映射，必须包含一个 primary_key。
  llm_description: Do not generate or change this form field.
  form: form
- name: port
  type: number
  required: false
  default: 0
  label:
    en_US: Port
    zh_Hans: 端口
  human_description:
    en_US: TCP port; defaults to 5432 for PostgreSQL and 3306 for MySQL.
    zh_Hans: TCP 端口；PostgreSQL 默认 5432，MySQL 默认 3306。
  llm_description: Do not request or change this connection field.
  form: form
- name: database
  type: string
  required: true
  label:
    en_US: Database
    zh_Hans: 数据库
  human_description:
    en_US: Database name.
    zh_Hans: 数据库名称。
  llm_description: Do not request or change this connection field.
  form: form
- name: username
  type: string
  required: true
  label:
    en_US: Username
    zh_Hans: 用户名
  human_description:
    en_US: A least-privilege read-only database account.
    zh_Hans: 具备最小只读权限的数据库账号。
  llm_description: Do not request or change this connection field.
  form: form
- name: password
  type: secret-input
  required: true
  label:
    en_US: Password
    zh_Hans: 密码
  human_description:
    en_US: Used only for this connection; never returned or persisted by the plugin.
    zh_Hans: 仅用于本次连接；插件不会返回或持久化。
  llm_description: Do not request, repeat, or reveal this secret.
  form: form
- name: ssl_mode
  type: string
  required: false
  default: verify-full
  label:
    en_US: TLS mode
    zh_Hans: TLS 模式
  human_description:
    en_US: verify-full by default; use the database's certificate configuration.
    zh_Hans: 默认 verify-full；请配置数据库证书校验。
  llm_description: Do not request or change this connection field.
  form: form
- name: sql
  type: string
  required: false
  label:
    en_US: SQL
    zh_Hans: SQL
  human_description:
    en_US: One SELECT or pure read-only WITH query using named placeholders.
    zh_Hans: 一条使用命名占位符的 SELECT 或纯只读 WITH 查询。
  llm_description: Generate a single read-only SELECT/WITH query. Never generate writes, DDL, DCL, multiple statements, locking clauses, or SELECT INTO/OUTFILE.
  form: llm
- name: tcpr_query_json
  type: string
  required: false
  label:
    en_US: TCPR query JSON
    zh_Hans: TCPR 查询 JSON
  human_description:
    en_US: LLM-provided JSON with hard, soft, select, and top_k; values are bound as SQL parameters.
    zh_Hans: LLM 提供的包含 hard、soft、select、top_k 的 JSON；值均作为 SQL 参数绑定。
  llm_description: Return a JSON object. Use hard constraints for required filters and soft [{constraint,weight}] constraints for ranking. Never put SQL, table names, column expressions, or connection data here.
  form: llm
- name: parameters_json
  type: string
  required: false
  label:
    en_US: Query parameters JSON
    zh_Hans: 查询参数 JSON
  human_description:
    en_US: JSON object whose keys match named SQL placeholders, for example {"status":"active"}.
    zh_Hans: 与 SQL 命名占位符匹配的 JSON 对象，例如 {"status":"active"}。
  llm_description: Return only a JSON object of parameter values; do not put SQL in this field.
  form: llm
output_schema:
  type: object
  properties:
    status:
      type: string
      description: OK or a stable error status.
    database_type:
      type: string
      description: Normalized database type used for this invocation.
    query_mode:
      type: string
      description: tcpr or explicitly selected raw_sql mode.
    rows:
      type: array
      description: At most 100 serialized rows.
      items:
        type: object
        additionalProperties: true
    row_count:
      type: integer
      description: Number of returned rows.
    columns:
      type: array
      items:
        type: string
    truncated:
      type: boolean
      description: True when the remote result exceeded the row limit.
    error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
extra:
  python:
    source: tools/remote_query.py
