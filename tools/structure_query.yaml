identity:
  name: structure_query
  author: lyts825
  label:
    en_US: Structure Query
    zh_Hans: 结构化查询
description:
  human:
    en_US: Convert a natural-language or JSON requirement into validated TCPR query JSON.
    zh_Hans: 将自然语言或 JSON 需求转换为已校验的 TCPR 查询 JSON。
  llm: Deterministic schema-aware conversion runs first; a selected Dify Parameter Extractor may be called once only for non-empty natural language that fails deterministic parsing. Explicit JSON/dict input is never repaired by a model.
parameters:
- name: requirement
  type: string
  required: true
  label:
    en_US: Requirement
    zh_Hans: 检索需求
  human_description:
    en_US: A schema-aware requirement such as "color=red and count>=2", or a JSON query document.
    zh_Hans: 按索引字段填写的需求，例如“color=red 且 count>=2”，也可以直接传入 JSON 查询文档。
  llm_description: Provide a natural-language requirement using declared field names, or a JSON query document.
  form: llm
- name: fallback_model
  type: model-selector
  scope: llm
  required: false
  label:
    en_US: Fallback model
    zh_Hans: 回退模型
  human_description:
    en_US: Optional user-selected Dify model used once for failed natural-language parsing.
    zh_Hans: 自然语言确定性解析失败时最多调用一次的用户选择 Dify 模型。
  llm_description: Leave unset unless a single model fallback is explicitly needed.
  form: form
- name: index_id
  type: string
  required: true
  label:
    en_US: Index ID
    zh_Hans: 索引 ID
  human_description:
    en_US: Versioned index returned by build_index; its schema controls deterministic parsing.
    zh_Hans: build_index 返回的版本化索引 ID；其定义决定确定性解析规则。
  llm_description: Pass the index_id returned by build_index so parsing uses its declared schema.
  form: llm
output_schema:
  type: object
  properties:
    message:
      type: string
      description: Stable human-readable status message.
    status:
      type: string
      description: OK or a stable error/status code.
    index_id:
      type: string
      description: Index snapshot whose schema was used for parsing.
    parse_source:
      type: string
      description: deterministic or model.
    query_json:
      type: string
      description: Compact JSON query document ready for the search tool.
    query:
      type: object
      description: Parsed query document with hard and soft constraint arrays.
      additionalProperties: true
    error:
      type: object
      description: Stable error object returned on failure.
      properties:
        code:
          type: string
          description: Stable error code.
        message:
          type: string
          description: Human-readable error detail.
      required: [code, message]
extra:
  python:
    source: tools/structure_query.py
